[package]
name = "rag"
version = "0.1.0"
edition = "2024"
authors = ["Jorge D. Ortiz-Fuentes"]
description = "Starting point for implementing RAG using Rig"
readme = "../README.md"
repository = "https://github.com/jdortiz/rs-ai"
license = "Apache-2.0"
keywords = ["ai"]

[dependencies]
anyhow = { workspace = true }
dotenvy = { workspace = true }
rig-core = { workspace = true }
rustyline = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { version = "1.2", features = ["serde"] }

[features]
open-ai-api = []

[lints]
workspace = true
